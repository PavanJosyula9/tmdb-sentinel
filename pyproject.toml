[project]
name = "tmdb-sentinel"
version = "0.1.0"
description = "A service for monitoring changes to TMDB metadata"
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "httpx",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true